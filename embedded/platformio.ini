[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
lib_ldf_mode = deep+
board_build.partitions = partitions.csv
lib_deps =
  sebastianregelmann/tflite-micro@1.26.41

[env:esp32cam_int8]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
lib_ldf_mode = deep+
board_build.partitions = partitions.csv
lib_deps =
  sebastianregelmann/tflite-micro@1.26.41
build_src_filter = -<*> +<../int8_src/main.cpp>

[env:esp32cam_stream]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
board_build.partitions = partitions.csv
build_src_filter = -<*> +<../stream_src/main.cpp>
